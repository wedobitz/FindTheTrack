<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Find the Track</title>

  <link rel="stylesheet" href="style.css?v=0.4.4" />
</head>
<body>

  <main class="app">

    <header class="header">
      <h1>Find the Track</h1>
      <p>Cerca un brano e trova subito il vinile sullo scaffale.</p>
    </header>

    <section class="search-section">
      <input
        id="searchInput"
        type="search"
        placeholder="Cerca brano, artista, album..."
        autocomplete="off"
      />

      <div class="chips">
        <button class="chip active" data-filter="all">Tutti</button>
        <button class="chip" data-filter="33">33 giri</button>
        <button class="chip" data-filter="45">45 giri</button>
      </div>
    </section>

    <section class="status">
      <span id="resultCount">Caricamento dati...</span>
    </section>

    <section id="results" class="results"></section>

    <footer class="footer">
      v0.4.4
    </footer>

  </main>

  <script src="app.js?v=0.4.4"></script>
</body>
</html>
